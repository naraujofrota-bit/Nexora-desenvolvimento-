<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>{% block title %}Nexora{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'core/styles.css' %}">
  <link rel="stylesheet" href="{% static 'core/interactions.css' %}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    .brand-lockup{display:block;width:250px;height:58px;background:url('{% static "core/logo.png" %}') left center/contain no-repeat}
    .form-page{max-width:860px;margin:32px auto}.messages{padding:12px 16px;border-radius:12px;background:#eff6ff;margin:16px 0}
    .form-control{width:100%;padding:11px 13px;border:1px solid #dbe2ea;border-radius:10px;background:#fff;color:#17243a;font:inherit}
    .field{display:block;margin:14px 0}.field label{display:block;font-weight:600;margin-bottom:7px}
    .form-errors{color:#b42318;font-size:.9rem}.toolbar{display:flex;gap:12px;align-items:center}
    .auth-form{max-width:420px;width:100%;margin:18px auto}.auth-form button{width:100%;margin-top:16px}
  </style>
</head>
<body>
{% block body %}{% endblock %}
<script>
document.querySelectorAll('[data-open-demand]').forEach(b=>b.addEventListener('click',()=>location.href="{% url 'demand-create' %}"));
const theme=localStorage.getItem('nexora.theme');if(theme==='dark')document.body.classList.add('dark');
document.querySelectorAll('.theme-toggle').forEach(b=>b.addEventListener('click',()=>{document.body.classList.toggle('dark');localStorage.setItem('nexora.theme',document.body.classList.contains('dark')?'dark':'light')}));
</script>
</body>
</html>
