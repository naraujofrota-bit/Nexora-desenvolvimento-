{% extends "core/base.html" %}
{% load static %}
{% block title %}Entrar · Nexora{% endblock %}
{% block body %}
<main class="login-screen">
  <section class="login-card">
    <div class="login-mark" aria-label="Nexora" style="height:100px;background:url('{% static "core/logo.png" %}') center/contain no-repeat"></div>
    <span class="eyebrow">GESTÃO DE DEMANDAS</span>
    <h1>Acesse o Nexora</h1>
    <p class="muted">Entre com seu usuário e senha.</p>
    {% if form.errors %}<p class="form-errors">Usuário ou senha inválidos.</p>{% endif %}
    <form method="post" class="auth-form">{% csrf_token %}
      <label class="field">Usuário{{ form.username }}</label>
      <label class="field">Senha{{ form.password }}</label>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="button primary" type="submit">Entrar</button>
    </form>
  </section>
</main>
{% endblock %}
